name: Monitor travel source updates

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source_id:
          - govuk-fcdo-japan
          - govuk-fcdo-paraguay
          - govuk-fcdo-qatar
          - govuk-fcdo-saudi-arabia
          - govuk-fcdo-south-africa
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Collect source sections
        run: python3 -m collectors.govuk_fcdo --source-id "${SOURCE_ID}" --output-dir data/candidates
        env:
          SOURCE_ID: ${{ matrix.source_id }}

      - name: Save changed source versions for review
        run: python3 -m collectors.import_candidates "data/candidates/${SOURCE_ID}.json"
        env:
          SOURCE_ID: ${{ matrix.source_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
